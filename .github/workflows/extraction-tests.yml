name: Validate notebook modules

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "src/**"

permissions:
  contents: read

jobs:
  extraction-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source extraction
        run: python -m pytest -q
      - name: Generate modules from the original notebook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/extract_experiments.py
      - name: Verify generated modules are up to date
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git diff --exit-code -- src/experiments
