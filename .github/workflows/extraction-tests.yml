name: Validate and generate notebook modules

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "src/**"

permissions:
  contents: write

jobs:
  extraction-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source extraction
        run: python -m pytest -q
      - name: Generate original experiment modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/extract_experiments.py
      - name: Commit generated modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/experiments
          if ! git diff --cached --quiet; then
            git commit -m "Generate modular sources from original notebook"
            git push
          fi
